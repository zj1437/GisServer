#服务端口
server:
  port: 8091
#dubbo配置
dubbo:
  application:
    name: tileserver
  registry:
    protocol: zookeeper
    address: zookeeper://127.0.0.1:2181
  protocol:
    name: dubbo
    port: 20881
  provider:
    loadbalance: roundrobin #默认负载均衡策略
  consumer:
    timeout: 30000
    retries: 3
#日志的记录，使用logback
logging:
  config: classpath:config/logback-spring.xml
#  level:
#    org.freeserver.htc.dao: debug
#数据库及数据库连接池的使用  psql
jasypt:
  encryptor:
    password: puyousoft
    algorithm: PBEWithMD5AndDES
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.NoIvGenerator
    string-output-type: base64
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5436/py_data  #切图数据服务
    username: postgres
    password: pyserver2022
    druid:
      initial-size: 30
      max-active: 500
      #获取连接超时时间
      max-wait: 60000
      #监测需要关闭的空闲链接时间间隔
      time-between-eviction-runs-millis: 60000
      #空闲链接最小生存时间
      min-evictable-idle-time-millis: 60000
      validation-query: SELECT 1
      test-on-borrow: false
      test-while-idle: true
      test-on-return: false
      filters: stat,wall,log4j
  #mongodb配置
  data:
    mongodb:
      uri: mongodb://localhost:27017
      database: py_data
  #设置redis的基础配置
  redis:
    database: 1
    host: 127.0.0.1
    port: 6379
    timeout: 10000
    jedis:
      pool:
        max-idle: 10
        max-active: 500
        max-wait: 10000
  #应用名称
  application:
    name: htc
#mybatis的配置
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: org.pygisserver.common
  configuration:
    cache-enabled: true
