#服务端口
server:
  port: 8092
  servlet:
    context-path: /render
  jetty:
    threads:
      acceptors: 2  
      selectors: 4
#日志的记录，使用logback
logging:
  config: classpath:config/logback-spring.xml
#dubbo配置
dubbo:
  application:
    name: render
  registry:
    protocol: zookeeper
    address: zookeeper://127.0.0.1:2181
  protocol:
    name: dubbo
    port: 20880
  provider:
    loadbalance: roundrobin #默认负载均衡策略
    timeout: 1000000
#设置redis的基础配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5436/py_data  #切图数据服务
    username: postgres
    password: pyserver2022
    druid:
      initial-size: 30
      max-active: 500
          #获取连接超时时间
      max-wait: 60000
          #监测需要关闭的空闲链接时间间隔
      time-between-eviction-runs-millis: 60000
          #空闲链接最小生存时间  
      min-evictable-idle-time-millis: 60000
      validation-query: SELECT 1
      test-on-borrow: false
      test-while-idle: true   
      test-on-return: false
  redis:
    database: 1
    host: 127.0.0.1
    port: 6379
    timeout: 10000
    jedis:
      pool:
        max-idle: 10
        max-active: 500
        max-wait: 10000



